# Render Blueprint: one PostgreSQL database and two web services.
# In Render: New > Blueprint > pick this repository. Render redeploys on every push to main.
databases:
  - name: campusfix-db
    databaseName: campusfix
    plan: free

services:
  - type: web
    name: campusfix-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npm run db:setup -- --no-demo
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campusfix-db
          property: connectionString   # internal URL, no SSL needed
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: ADMIN_EMAIL
        value: admin@sherubtse.edu.bt
      - key: ADMIN_PASSWORD
        sync: false                    # set it yourself in the Render dashboard

  - type: web
    name: campusfix-web
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: API_URL
        sync: false                    # e.g. https://campusfix-api.onrender.com/api
      - key: COOKIE_SECURE
        value: "true"
